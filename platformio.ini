; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-dev
build_cache_dir = ~/tmp/.pio/build/esp32
data_dir = data-${PIOENV}

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17 -fexceptions
	-I include
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    -D ARDUINO_LOOP_STACK_SIZE=32768
    -Wall ; -Wextra -Wpedantic -Wconversion -Werror
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D FIRMWARE_VERSION_RAW=${sysenv.FIRMWARE_VERSION}
	-D CHIP_FAMILY_RAW=ESP32-WROOM
	-D GITHUB_REPO=${sysenv.GITHUB_REPO}
	-D GIT_COMMIT_SHA_RAW=${sysenv.GIT_COMMIT_SHA}
	-D HOST_NAME=CoopController
	-D SYSLOG_SERVER=192.168.2.202
	-D SYSLOG_PORT=514
	-D OTA_PASSWD=
	-D AP_PASSWD=
	-D SERIAL_BAUD=115200
	-D WIFI_LED_B_PIN=23 ; Output, Wifi heartbeat connection status
	-D BUZZER_B_PIN=15 ; Output
	-D TEMP_METER_PIN=32 ; Input/Output with external pullup, yellow on 3-pin
	-D TEMP_METER_2_PIN=33 ; Input/Output with external pullup, yellow on 3-pin
	-D OUT_PUMP_PIN=26 ; Output, brown /knot
	-D OUT_LIGHT_PIN=25 ; Output, brown
	-D DOOR_MANUAL_SWITCH_B_PIN=16 ; Input w/ internal pullup, 2-pin
	-D DOOR_A_FAULT_B_PIN=34 ; Input with external pullup
	-D OUT_DOOR_A_OPEN_POS_PIN=13 ; Output, IN1/OUT1, (purple or blue) on 8-pin
	-D OUT_DOOR_A_OPEN_NEG_PIN=12 ; Output, IN2/OUT2, brown on 8-pin
	-D DOOR_A_HALL_SENSOR_OPEN_B_PIN=36 ; Input with external pullup, (white or green/white) on 8-pin
	-D DOOR_A_HALL_SENSOR_CLOSED_B_PIN=39 ; Input with external pullup, green on 8-pin
	; power on 8-pin is + (red or blue/white) and - (black or brown/white)
	; unused on 8-pin orange and (yellow or orange/white)
lib_compat_mode = strict
board_build.filesystem = littlefs
; Firmware library dependencies pinned to exact versions to prevent silent
; drift. ESPAsyncWebServer 3.10.2 changed WebRequestMethodComposite from an
; integer typedef to a class, which breaks compilation of our switch(method())
; code; 3.10.1 is the newest release before that API break and matches the
; version CI resolved for the deployed v0.4.4 baseline.
lib_deps =
	bblanchon/ArduinoJson@^7.2.1
	esp32async/ESPAsyncWebServer@3.10.1
	ayushsharma82/ElegantOTA@^3.1.7
build_unflags = 
    -std=gnu++11
build_src_flags = -fconcepts
check_skip_packages = yes
check_src_filters =
    +<src/*>
    +<include/*>
    +<lib/*>
    +<test/common/*>
    -<.pio/*>
extra_scripts = 
	build_scripts/generate_build_timestamp.py
	post:build_scripts/post_build.py
; upload_flags =
;   --auth=
; upload_protocol = espota
; upload_port = coopcontroller.local
; upload_port = coopcontrollertest.local
; upload_port = COM22
; upload_port = 192.168.2.28
; monitor_port = COM22
monitor_speed = 115200


[env:esp32-dev]
board = esp32dev
framework = arduino
build_type = debug
extra_scripts = 
	${env.extra_scripts}
	build_scripts/build_web.py
test_framework = unity
test_ignore = 
	unit_desktop/*


[env:esp32-release]
board = esp32dev
framework = arduino
build_type = release
build_flags =
    ${env.build_flags}
    -Os
	-DNDEBUG
	-Wl,-S
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
extra_scripts = 
	${env.extra_scripts}
	build_scripts/build_web.py
	build_scripts/merge_bin.py
test_framework = unity
test_ignore = 
	unit_desktop/*

	
[env:unit-test-desktop]
; Switch to this project env in platformio.ini to have proper error highlighting
; PIO Debug (skip Pre-Debug) to debug tests
platform = native
build_type = debug
debug_test = yes
lib_deps =
	google/googletest@^1.15.2
	; skaygin/ArduinoNative@^0.1.4
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_flags = 
build_flags =
    ${env.build_flags}
	-Wno-missing-template-arg-list-after-template-kw  ; Apple clang 21 hard-errors on fakeit.hpp
	-D ARDUINO
	-D UNIT_TEST_DESKTOP
    -I test/common/mocks
    -I test/unit_desktop/desktop_mocks
	-I .pio/libdeps/unit-test-desktop/SolarCalculator/src ; Use lib directly since it works on desktop
test_framework = googletest
test_ignore = 
	unit_embedded/*
build_src_filter = ; Only affects regular compile, not test run
    -<*>
    +<../test/unit_desktop>
    +<../test/common/mocks>
extra_scripts = 
	${env.extra_scripts}
	post:build_scripts/fix_intellisense_paths.py


[env:esp32-emulate-hardware]
board = esp32dev
framework = arduino
build_type = debug
build_flags =
    -std=gnu++17 -fexceptions
	-I include
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    -Wall
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D FIRMWARE_VERSION_RAW=${sysenv.FIRMWARE_VERSION}
	-D CHIP_FAMILY_RAW=ESP32-WROOM
	-D GITHUB_REPO=${sysenv.GITHUB_REPO}
	-D GIT_COMMIT_SHA_RAW=${sysenv.GIT_COMMIT_SHA}
	-D HOST_NAME=CoopHWEmulator
	-D SYSLOG_SERVER=192.168.2.202
	-D SYSLOG_PORT=514
	-D OTA_PASSWD=
	-D AP_PASSWD=
	-D SERIAL_BAUD=115200
	; ============================================================
	; EMULATOR INPUT PINS (Reading Main Controller Outputs)
	; ============================================================
	; These pins read the output signals from the main Coop Controller
	-D EMU_READ_PUMP_PIN=34      ; Read OUT_PUMP_PIN (26) from main - Input-only GPIO
	-D EMU_READ_LIGHT_PIN=35     ; Read OUT_LIGHT_PIN (25) from main - Input-only GPIO
	-D EMU_READ_DOOR_POS_PIN=36  ; Read OUT_DOOR_A_OPEN_POS (13) - Input-only GPIO (VP)
	-D EMU_READ_DOOR_NEG_PIN=39  ; Read OUT_DOOR_A_OPEN_NEG (12) - Input-only GPIO (VN)
	-D EMU_READ_BUZZER_PIN=32    ; Read BUZZER_B_PIN (15) from main
	-D EMU_READ_LED_PIN=33       ; Read WIFI_LED_B_PIN (23) from main
	; ============================================================
	; EMULATOR OUTPUT PINS (Driving Main Controller Inputs)
	; ============================================================
	; These pins simulate hardware signals to the main Coop Controller
	-D EMU_WATER_PULSE1_PIN=26   ; Drive TEMP_METER_PIN (32) - Water pulses
	-D EMU_WATER_PULSE2_PIN=25   ; Drive TEMP_METER_2_PIN (33) - Water pulses
	-D EMU_HALL_OPEN_PIN=13      ; Drive DOOR_A_HALL_SENSOR_OPEN_B (36)
	-D EMU_HALL_CLOSE_PIN=12     ; Drive DOOR_A_HALL_SENSOR_CLOSED_B (39)
	-D EMU_MANUAL_SW_PIN=27      ; Drive DOOR_MANUAL_SWITCH_B (16)
	-D EMU_DOOR_FAULT_PIN=14     ; Drive DOOR_A_FAULT_B (34)
	; ============================================================
	; EMULATOR STATUS PINS
	; ============================================================
	-D EMU_STATUS_LED_PIN=2      ; Built-in LED for emulator status
	-D EMU_WIFI_LED_PIN=4        ; Emulator WiFi connection status
lib_deps =
	bblanchon/ArduinoJson@^7.2.1
	esp32async/ESPAsyncWebServer@3.10.1
	ayushsharma82/ElegantOTA@^3.1.7
extra_scripts =
	post:build_scripts/post_build.py
	build_scripts/build_web.py
test_ignore =
	common/*
	unit_desktop/*
	unit_embedded/*
build_src_filter =
    -<*>
    +<../emulate_hardware/src>
custom_WEB_SRC_DIR = emulate_hardware/web
upload_port = COM22
monitor_port = COM22