; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; pio run -t compiledb
[platformio]
default_envs = esp32-dev
build_cache_dir = ~/tmp/.pio/build/esp32

[env]
framework = arduino
platform = espressif32
board = esp32dev
lib_deps = 
	; git+https://github.com/jrowny/cc_sfs
	; olikraus/U8g2@^2.36.12
				; styropyr0/SSD1306 OLED Display@^1.0.4
				; adafruit/Adafruit SSD1306@^2.5.15
	milesburton/DallasTemperature@^4.0.4
				; MaffooClock/ESP32RotaryEncoder@^1.1.2
				; igorantolic/Ai Esp32 Rotary Encoder@^1.7
				; madhephaestus/ESP32Encoder@^0.11.8
				; stutchbury/EncoderButton@^1.0.6
	; maffooclock/ESP32RotaryEncoder@^1.1.2
				; AsyncTCP@3.3.7
				; ayushsharma82/ElegantOTA@^3.1.0
				; bblanchon/ArduinoJson @ 6.19.4
				; esp32async/ESPAsyncWebServer@3.7.3
				; links2004/WebSockets@^2.6.1
				; robtillaart/UUID@^0.2.0
	esp32async/AsyncTCP@3.4.7
	ayushsharma82/ElegantOTA@^3.1.7
	ArduinoOTA
	bblanchon/ArduinoJson@7.4.2
	esp32async/ESPAsyncWebServer@3.8.0
	robtillaart/UUID@^0.2.0
	; mobizt/ReadyMail@^0.3.6
	; cotestatnt/AsyncTelegram@^1.1.3
lib_compat_mode = strict
board_build.filesystem = littlefs
build_unflags = 
    -std=gnu++11
build_src_flags = -fconcepts
build_flags = 
    -std=gnu++17 -fexceptions
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
	-isystem "${platformio.workspace_dir}/libdeps"
    -Wall ; -Wextra -Wpedantic -Wconversion -Werror
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D FIRMWARE_VERSION_RAW=${sysenv.FIRMWARE_VERSION}
	-D CHIP_FAMILY_RAW=ESP32-WROOM
	-D SERIAL_BAUD=115200
	-D TEMP_METER_PIN=32
	-D TEMP_METER_2_PIN=33
	-D OUT_PUMP_PIN=26
	-D OUT_LIGHT_PIN=25
check_skip_packages = yes
check_src_filters =
    +<src/*>
    +<include/*>
    +<lib/*>
    +<test/common/*>
    -<.pio/*>
extra_scripts = 
	build_scripts/build_web.py
	post:build_scripts/post_build.py
upload_protocol = espota
; upload_flags =
;   --auth=your_password_here
; upload_port = coopcontroller.local
upload_port = 192.168.2.36
; upload_port = COM22
monitor_port = COM22
monitor_speed = 115200


[env:esp32-dev]


[env:esp32-release]
build_type = release
build_flags =
    ${env.build_flags}
    -Os
	-DNDEBUG
	-Wl,-S
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
extra_scripts = 
	${env.extra_scripts}
	build_scripts/merge_bin.py