name: Release Build & Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag"
        required: true
        default: "dev"

jobs:
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      on-master: ${{ steps.check.outputs.on-master }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Tag is on Master
        id: check
        run: |
          # Skip check for manual workflow dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "on-master=true" >> $GITHUB_OUTPUT
            echo "Manual workflow dispatch - proceeding with build"
            exit 0
          fi

          git fetch origin master
          if git merge-base --is-ancestor HEAD origin/master; then
            echo "on-master=true" >> $GITHUB_OUTPUT
            echo "Tag is on master branch - proceeding with build"
          else
            echo "on-master=false" >> $GITHUB_OUTPUT
            echo "Tag is not on master branch - skipping build"
          fi

  build:
    needs: check-branch
    if: needs.check-branch.outputs.on-master == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
            echo "version=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Version from manual input: $TAG_NAME"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "version=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Version from tag: $TAG_NAME"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Install Build Script Python Dependencies
        run: |
          pip install -r build_scripts/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Build Web UI and Filesystem Image
        run: |
          pio run -e esp32-release -t buildfs

      - name: Build Firmware (Release)
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Building firmware with version: ${{ steps.version.outputs.version }}"
          echo "Git commit SHA: ${{ github.sha }}"
          pio run -e esp32-release

      - name: Extract Firmware Artifacts
        run: |
          mkdir -p artifacts
          cp .pio/build/esp32-release/firmware.bin artifacts/firmware.bin
          cp .pio/build/esp32-release/littlefs.bin artifacts/littlefs.bin
          cp .pio/build/esp32-release/firmware_merged.bin artifacts/firmware_merged.bin
          ls -lh artifacts/
          echo "FIRMWARE_SIZE=$(stat -c%s artifacts/firmware.bin)" >> $GITHUB_ENV
          echo "FILESYSTEM_SIZE=$(stat -c%s artifacts/littlefs.bin)" >> $GITHUB_ENV
          echo "MERGED_SIZE=$(stat -c%s artifacts/firmware_merged.bin)" >> $GITHUB_ENV

      - name: Calculate Checksums
        run: |
          cd artifacts
          sha256sum firmware.bin > firmware.bin.sha256
          sha256sum littlefs.bin > littlefs.bin.sha256
          sha256sum firmware_merged.bin > firmware_merged.bin.sha256
          cat firmware.bin.sha256
          cat littlefs.bin.sha256
          cat firmware_merged.bin.sha256

          echo "FIRMWARE_SHA256=$(cut -d' ' -f1 firmware.bin.sha256)" >> $GITHUB_ENV
          echo "FILESYSTEM_SHA256=$(cut -d' ' -f1 littlefs.bin.sha256)" >> $GITHUB_ENV
          echo "MERGED_SHA256=$(cut -d' ' -f1 firmware_merged.bin.sha256)" >> $GITHUB_ENV

      - name: Set Up Native Desktop C++ Test Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Run Desktop Unit Tests
        run: |
          pio test -e unit-test-desktop

      - name: Run PlatformIO Embedded Unit Tests
        if: runner.environment == 'self-hosted' && contains(runner.name, 'usb-hardware')
        run: |
          pio test # Can only be run with physical embedded hardware connected
          pio test -e esp32-release # Can only be run with physical embedded hardware connected

      - name: Generate Version Manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 build_scripts/generate_version_manifest.py \
            --version "${{ steps.version.outputs.version }}" \
            --firmware-path "artifacts/firmware.bin" \
            --filesystem-path "artifacts/littlefs.bin" \
            --merged-path "artifacts/firmware_merged.bin"

          cp version_manifest.json artifacts/version_manifest.json
          cat artifacts/version_manifest.json

      - name: Generate Changelog
        id: changelog
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CHANGELOG=No changelog available for manual releases." >> $GITHUB_ENV
            echo "Manual workflow dispatch - skipping changelog generation"
            exit 0
          fi

          # Get the previous tag (if it exists)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREVIOUS_TAG"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "CHANGELOG=Initial release." >> $GITHUB_ENV
            echo "No previous tag found - skipping changelog generation"
            exit 0
          fi

          # Generate changelog using git log between the previous tag and the current commit
          CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)")
          echo "Generated changelog:"
          echo "$CHANGELOG"

          # Set the changelog as a multiline environment variable for use in the release body
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            artifacts/firmware.bin
            artifacts/littlefs.bin
            artifacts/firmware_merged.bin
            artifacts/version_manifest.json
            artifacts/firmware.bin.sha256
            artifacts/littlefs.bin.sha256
            artifacts/firmware_merged.bin.sha256
          body: |
            # Firmware Release ${{ steps.version.outputs.version }}

            ${{ env.CHANGELOG }}

            ## Download Firmware
            - **Merged Binary (recommended for OTA):** firmware_merged.bin
            - **Firmware Binary:** firmware.bin
            - **Filesystem Binary:** littlefs.bin
            - **Version Manifest:** version_manifest.json (for OTA updates)

            ## Checksums
            **Firmware SHA256:** ${{ env.FIRMWARE_SHA256 }}
            **Filesystem SHA256:** ${{ env.FILESYSTEM_SHA256 }}
            **Merged SHA256:** ${{ env.MERGED_SHA256 }}

            ## Build Artifacts
            - Firmware Size: ${{ env.FIRMWARE_SIZE }} bytes
            - Filesystem Size: ${{ env.FILESYSTEM_SIZE }} bytes
            - Merged Size: ${{ env.MERGED_SIZE }} bytes
            - Git Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Update latest tag to ${{ steps.version.outputs.version }}"
          git push origin latest --force
